# Builds the Volatility 2 executables that Cyber Triage ships: PyInstaller one-file builds of
# vol.py, from upstream's pyinstaller.spec, for Windows x64 and Linux x86-64 on Python 2.7.18,
# with the packages pinned in ct/requirements*.txt. Every run keeps them as workflow artifacts.
# Pushing a ct-* tag also publishes them, with SHA256SUMS, as a GitHub release. See ct/README.md.
name: ct_release
on:
  push:
    branches:
    - master
    tags:
    - 'ct-*'
  pull_request:
    branches:
    - master
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build_windows:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Name the build
      id: name
      shell: bash
      run: |
        if [ "${GITHUB_REF_TYPE}" = "tag" ]; then NAME="${GITHUB_REF_NAME}"; else NAME="$(git rev-parse --short=12 HEAD)"; fi
        echo "package=volatility-${NAME}-windows-x64" >> "${GITHUB_OUTPUT}"
    - name: Install Python 2.7.18
      # actions/setup-python no longer offers 2.7, so install python.org's last 2.7 installer,
      # pinned by SHA-256. ALLUSERS=1 puts its Visual C++ 2008 runtime in WinSxS, where
      # PyInstaller finds it to bundle.
      run: |
        $msi = Join-Path $Env:RUNNER_TEMP 'python-2.7.18.amd64.msi'
        Invoke-WebRequest -Uri 'https://www.python.org/ftp/python/2.7.18/python-2.7.18.amd64.msi' -OutFile $msi
        $sha256 = (Get-FileHash -Algorithm SHA256 -Path $msi).Hash
        If ($sha256 -ne 'b74a3afa1e0bf2a6fc566a7b70d15c9bfabba3756fb077797d16fffa27800c05') { Throw "$msi has SHA-256 $sha256" }
        $log = Join-Path $Env:RUNNER_TEMP 'python-2.7.18.log'
        $install = Start-Process -FilePath msiexec.exe -Wait -PassThru -ArgumentList '/i', $msi, '/qn', '/norestart', 'ALLUSERS=1', 'TARGETDIR=C:\Python27', '/l*v', $log
        If ($install.ExitCode -ne 0) { Get-Content -Path $log -Tail 50; Throw "msiexec exited with $($install.ExitCode)" }
        C:\Python27\python.exe -c "import sys; print(sys.version)"
    - name: Install build dependencies
      run: |
        C:\Python27\python.exe -m pip install --disable-pip-version-check -r ct\requirements-bootstrap.txt
        If (${LASTEXITCODE} -ne 0) { Exit 1 }
        # distorm3 3.3.4 has no wheel, and its sdist needs Visual C++ 2008 to build. Install
        # its PyPI Windows installer, which carries the distorm3.dll; pip then finds the
        # distorm3 pin in requirements.txt already satisfied.
        $installer = Join-Path $Env:RUNNER_TEMP 'distorm3-3.3.4.win-amd64.exe'
        Invoke-WebRequest -Uri 'https://files.pythonhosted.org/packages/1c/f6/3f079574078996cc7a4471b3ebac31750db6c993457dee5f2157c838f6a0/distorm3-3.3.4.win-amd64.exe' -OutFile $installer
        $sha256 = (Get-FileHash -Algorithm SHA256 -Path $installer).Hash
        If ($sha256 -ne '0e9774e25f71ffb84d00c2b1b3effbafe6996ce687b316d0c1aa8f0439a6ca71') { Throw "$installer has SHA-256 $sha256" }
        C:\Python27\python.exe ct\install_wininst.py $installer
        If (${LASTEXITCODE} -ne 0) { Exit 1 }
        C:\Python27\python.exe -m pip install --disable-pip-version-check --no-build-isolation -r ct\requirements-build.txt
        If (${LASTEXITCODE} -ne 0) { Exit 1 }
        C:\Python27\python.exe -m pip freeze --all
    - name: Build
      run: |
        C:\Python27\python.exe -m PyInstaller --clean --noconfirm --distpath build\dist --workpath build\work pyinstaller.spec
        If (${LASTEXITCODE} -ne 0) { Exit 1 }
    - name: Run smoke test
      run: |
        C:\Python27\python.exe ct\smoke_test.py build\dist\volatility.exe
    - name: Package
      # Cyber Triage runs the exe as volatility-a438e76.exe, after the upstream commit it is built from.
      env:
        PACKAGE: ${{ steps.name.outputs.package }}
      run: |
        New-Item -ItemType Directory -Path "dist\${Env:PACKAGE}" | Out-Null
        Copy-Item -Path build\dist\volatility.exe -Destination "dist\${Env:PACKAGE}\volatility-a438e76.exe"
        Copy-Item -Path LICENSE.txt, LEGAL.txt, AUTHORS.txt, CREDITS.txt, README.txt, ct\requirements.txt, ct\requirements-build.txt, ct\requirements-bootstrap.txt -Destination "dist\${Env:PACKAGE}"
        @(
          "volatility-a438e76.exe, a PyInstaller one-file build of Volatility 2.6.1 for Cyber Triage."
          "Source:  ${Env:GITHUB_SERVER_URL}/${Env:GITHUB_REPOSITORY}/tree/${Env:GITHUB_SHA}"
          "Build:   ${Env:GITHUB_SERVER_URL}/${Env:GITHUB_REPOSITORY}/actions/runs/${Env:GITHUB_RUN_ID}"
          "Python:  $(C:\Python27\python.exe -c 'import platform; print(platform.python_version())')"
          "Licence: GPL-2.0-or-later, see LICENSE.txt and LEGAL.txt."
          "Bundled packages: see requirements.txt; build tools: requirements-build.txt and requirements-bootstrap.txt."
        ) | Set-Content -Path "dist\${Env:PACKAGE}\SOURCE.txt" -Encoding ascii
        Compress-Archive -Path "dist\${Env:PACKAGE}" -DestinationPath "dist\${Env:PACKAGE}.zip"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ steps.name.outputs.package }}
        path: dist/${{ steps.name.outputs.package }}.zip
        if-no-files-found: error
  build_linux:
    runs-on: ubuntu-24.04
    # The official Python 2.7.18 image, on Debian 10 (buster), pinned by digest. Debian 10 has
    # glibc 2.28, the oldest of any Linux still in support. Everything the executable bundles
    # comes from it, so it runs on RHEL 8, Debian 10 and every newer distro.
    container: python:2.7.18-buster@sha256:c934af72b8bd03b9804d5bde2569c320926e70392d708d113a2e71bcf98c8a20
    defaults:
      run:
        # The image's sh is dash.
        shell: bash
    steps:
    - name: Install build tools
      # Debian moved buster to archive.debian.org. jansson is for the yara cuckoo module.
      # The image already has git, gcc, binutils and the OpenSSL headers.
      run: |
        printf '%s\n' 'deb http://archive.debian.org/debian buster main' 'deb http://archive.debian.org/debian-security buster/updates main' > /etc/apt/sources.list
        apt-get update
        apt-get install -y --no-install-recommends libjansson-dev
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Name the build
      id: name
      # GITHUB_SHA is the commit checked out. It avoids running git on a workspace the
      # container's root user does not own.
      run: |
        if [ "${GITHUB_REF_TYPE}" = "tag" ]; then NAME="${GITHUB_REF_NAME}"; else NAME="${GITHUB_SHA::12}"; fi
        echo "package=volatility-${NAME}-linux-x86_64" >> "${GITHUB_OUTPUT}"
    - name: Install build dependencies
      # yara-python has no Linux wheel for Python 2.7. Build it with the modules the Windows
      # wheel has: dotnet and cuckoo, and hash, which it enables when it finds libcrypto.
      run: |
        python -m pip install --disable-pip-version-check -r ct/requirements-bootstrap.txt
        python -m pip install --disable-pip-version-check --no-build-isolation --no-binary yara-python --global-option=build --global-option=--enable-dotnet --global-option=--enable-cuckoo "$(grep '^yara-python==' ct/requirements.txt)"
        python -m pip install --disable-pip-version-check --no-build-isolation -r ct/requirements-build.txt
        python -m pip freeze --all
    - name: Build
      run: |
        python -m PyInstaller --clean --noconfirm --distpath build/dist --workpath build/work pyinstaller.spec
    - name: Run smoke test
      run: |
        python ct/smoke_test.py build/dist/volatility
    - name: Package
      env:
        PACKAGE: ${{ steps.name.outputs.package }}
      run: |
        mkdir -p "dist/${PACKAGE}"
        cp build/dist/volatility LICENSE.txt LEGAL.txt AUTHORS.txt CREDITS.txt README.txt ct/requirements.txt ct/requirements-build.txt ct/requirements-bootstrap.txt "dist/${PACKAGE}/"
        {
          echo "volatility, a PyInstaller one-file build of Volatility 2.6.1 for Cyber Triage."
          echo "Source:  ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/${GITHUB_SHA}"
          echo "Build:   ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "Python:  $(python -c 'import platform; print(platform.python_version())')"
          echo "Runs on: x86-64 Linux with glibc 2.28 or later."
          echo "Licence: GPL-2.0-or-later, see LICENSE.txt and LEGAL.txt."
          echo "Bundled packages: see requirements.txt; build tools: requirements-build.txt and requirements-bootstrap.txt."
        } > "dist/${PACKAGE}/SOURCE.txt"
        tar -czf "dist/${PACKAGE}.tar.gz" -C dist "${PACKAGE}"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ steps.name.outputs.package }}
        path: dist/${{ steps.name.outputs.package }}.tar.gz
        if-no-files-found: error
  release:
    if: github.ref_type == 'tag'
    needs:
    - build_windows
    - build_linux
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        path: dist
        merge-multiple: true
    - name: Publish the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        cd dist
        sha256sum -- * > SHA256SUMS
        cat SHA256SUMS
        gh release create "${GITHUB_REF_NAME}" \
          --repo "${GITHUB_REPOSITORY}" \
          --title "${GITHUB_REF_NAME}" \
          --notes "Volatility 2 for Cyber Triage, for Windows and Linux, built from ${GITHUB_SHA}. See ct/README.md for what differs from upstream Volatility." \
          -- *
